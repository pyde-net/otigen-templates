# ─── Test 6: account not in tree reverts (invalid proof) ─────────
#
# Eve isn't in the tree, so no proof she can construct will hash
# back to the committed root. Bob's proof submitted by Eve recomputes
# to a node that lives at index 1 (bob's slot) — but the leaf hash
# differs because the caller (eve) is different, so the running hash
# at level 0 is leaf_hash(eve, 200), not leaf_B. Final root won't
# match → InvalidProof.
[[tests]]
name = "non_eligible_account_reverts_with_invalid_proof"

[[tests.calls]]
function = "init"
from     = "alice"

[[tests.calls]]
function = "set_root"
from     = "alice"
args     = ["0x460d7c8438ba16d0a26a5a8a4b2a49b462b5920e8ce06b098016296dabe64ccd"]

[[tests.calls]]
function = "claim"
from     = "eve"
args     = [
    "200",
    "0x0186c9a32ede478dcbeb6757159a60d87a34d5c355f5a75effe9de75fe2bee34cb00bb68a5a41b4cc5c202ab8a56dc9ba9fb9d81c18dbc88a477aa45995e2693d1db",
]
expect.revert = "InvalidProof"

