# merkle-claim-airdrop behaviour tests.
#
# ── Tree fixture ─────────────────────────────────────────────────
#
# 4 leaves, balanced binary tree, depth 2:
#
#                       root
#                     /      \
#                node_AB    node_CD
#                /   \       /   \
#           leaf_A leaf_B leaf_C leaf_D
#
# Each (claimant, amount) pair:
#   (alice, 100)  →  leaf_A
#   (bob,   200)  →  leaf_B
#   (carol, 300)  →  leaf_C
#   (dave,  400)  →  leaf_D
#
# Domain separation:
#   leaf = blake3("PYDE_LEAF" || addr_32B || amount_be_16B)
#   node = blake3("PYDE_NODE" || left_32B || right_32B)
#
# Account addresses come from the runner's default derivation
# `blake3(name)` (see [resolve.rs::blake3_address]), so the leaf
# hashes are deterministic. Constants below were generated by
# hashing those addresses against the (LEAF_TAG, amount) preimage
# offline. Regenerate by running the equivalent calculation in any
# Blake3 lib — the runner enforces agreement on first claim.
#
# Proof bytes encode each step as `[position_byte][sibling_32B]`:
#   position = 0 → running hash is on the LEFT, sibling on right
#   position = 1 → running hash is on the RIGHT, sibling on left

[accounts]
alice = {}
bob   = {}
carol = {}
dave  = {}
eve   = {}        # not in the tree — used for invalid-proof tests

[cheats]
now      = 1_700_000_000
chain_id = 31337

# ─── Test 1: set_root + first claim end-to-end ───────────────────
#
# Convention for every test that calls `set_root`: alice calls `init`
# first to become the recorded admin, then `set_root` (admin-only) lands.
[[tests]]
name = "set_root_then_alice_claims"

[tests.setup]
balances.__contract__ = "10_000"   # pre-fund so claim can actually pay alice

[[tests.calls]]
function = "init"
from     = "alice"

[[tests.calls]]
function = "set_root"
from     = "alice"
args     = ["0x460d7c8438ba16d0a26a5a8a4b2a49b462b5920e8ce06b098016296dabe64ccd"]

[[tests.calls]]
function = "merkle_root_first_byte"
expect.return_value = "70"          # 0x46 = 70

[[tests.calls]]
function = "claim"
from     = "alice"
args     = [
    "100",
    "0x00ba89b3f6178bbf8e5faa8018e02f6cfa8af7fb5e250c9262337ba73d2a206ad500bb68a5a41b4cc5c202ab8a56dc9ba9fb9d81c18dbc88a477aa45995e2693d1db",
]
expect.events = [
  { name = "Claim", claimant = "alice", amount = "100" },
]

[[tests.calls]]
function = "is_claimed"
args     = ["alice"]
expect.return_value = "1"

[[tests.calls]]
function = "total_claimed"
expect.return_value = "100"

# Funds actually moved: contract debited by 100, alice credited by 100.
[tests.expect]
balances.__contract__ = "9900"
balances.alice        = "100"

