# `dao-governance` behaviour tests for `otigen test`. The full e2e
# (cross-call + propose/vote/execute) lives at `tests/dao_e2e.py`; run
# `bash examples/dao-governance/tests/run_e2e.sh` from the otigen repo
# root to exercise it against a live devnet.
#
# Coverage focus here is the hardening guards that don't need the
# string / vec(address) / u64-keyed-map paths the engine test runner
# can't reach today:
#
#   - add_member zero-address / non-member / dup guards + happy path
#   - vote / execute_proposal guards on a proposal that doesn't exist
#   - the address-keyed `members` map round-trips through setup +
#     `is_member` view
#   - all scalar views return the seeded defaults
#
# Skipped (engine path limitations — track these for when the
# encoder closes the gap):
#
#   - `init()` — declared inputs `vec(address)` not yet supported by
#     the engine arg encoder, so the per-member zero-address guard
#     mirrors `add_member()`'s check (same code path, same revert
#     string) and the e2e suite exercises the full constructor flow.
#   - `propose()` — declared input `string` not yet supported by the
#     engine arg encoder.
#   - any vote/execute path past "proposal does not exist" — the
#     `proposal_*` maps are u64-keyed, so we can't seed proposals from
#     the test harness; live cross-call + quorum coverage lives in
#     `dao_e2e.py`.

[accounts]
alice = {}
bob   = {}
carol = {}

[cheats]
now      = 1_700_000_000
chain_id = 31337

# ── Test 1: fresh contract has zero proposals ──────────────────────
[[tests]]
name = "fresh_dao_has_zero_proposals"

[[tests.calls]]
function = "proposal_count"
expect.return_value = "0"

# ── Test 2: fresh contract has zero members ────────────────────────
[[tests]]
name = "fresh_dao_has_zero_members"

[[tests.calls]]
function = "member_count"
expect.return_value = "0"

# ── Test 3: is_member returns false for an unknown account ─────────
[[tests]]
name = "is_member_false_for_unknown_account"

[[tests.calls]]
function = "is_member"
args     = ["alice"]
expect.return_value = "0"

# ── Test 4: seeded membership round-trips through the view ─────────
#
# Mirrors what a successful `init([alice], 0, 51)` would have
# produced. Lets the rest of the suite exercise gated paths without
# needing `vec(address)` arg support.
[[tests]]
name = "seeded_member_is_visible_to_view"

[tests.setup]
storage.members.alice = "1"
storage.member_count  = "1"

[[tests.calls]]
function = "is_member"
args     = ["alice"]
expect.return_value = "1"

[[tests.calls]]
function = "member_count"
expect.return_value = "1"

# ── Tests 5-8: add_member is now self-call only (NEW hardening) ───
#
# The audit closed the critical Sybil-attack class where any single
# member could grow the member set unilaterally. `add_member` now
# requires `caller == self_address`, which is only true when the
# DAO calls itself via a successful `execute_proposal`. Direct
# member calls revert.
#
# Deeper happy-path / zero-address / duplicate guards still fire
# downstream of the self-call check; they're exercised in the
# Python e2e harness (`tests/dao_e2e.py`) which CAN run the
# propose → vote → execute flow. From the .test.toml the reachable
# invariant is the self-call guard itself.
[[tests]]
name = "add_member_direct_call_reverts"

[tests.setup]
storage.members.alice = "1"
storage.member_count  = "1"

[[tests.calls]]
function = "add_member"
from     = "alice"             # even an existing member can't add directly
args     = ["bob"]
expect.revert = "dao: membership changes require a passed proposal"

# Member set unchanged — confirms the guard runs BEFORE any writes.
[[tests.calls]]
function = "member_count"
expect.return_value = "1"

[[tests.calls]]
function = "is_member"
args     = ["bob"]
expect.return_value = "0"

# Same revert for a non-member caller — neither path can mutate the
# member set without going through a proposal.
[[tests]]
name = "add_member_non_member_caller_also_reverts"

[tests.setup]
storage.members.alice = "1"
storage.member_count  = "1"

[[tests.calls]]
function = "add_member"
from     = "bob"
args     = ["carol"]
expect.revert = "dao: membership changes require a passed proposal"

# remove_member has the same gating — no direct member can eject another.
[[tests]]
name = "remove_member_direct_call_reverts"

[tests.setup]
storage.members.alice = "1"
storage.members.bob   = "1"
storage.member_count  = "2"

[[tests.calls]]
function = "remove_member"
from     = "alice"
args     = ["bob"]
expect.revert = "dao: membership changes require a passed proposal"

[[tests.calls]]
function = "member_count"
expect.return_value = "2"

[[tests.calls]]
function = "is_member"
args     = ["bob"]
expect.return_value = "1"

# ── Test 9: vote on a non-existent proposal reverts ────────────────
#
# Caller IS a member (so we pass `require_member`), but proposal
# id 99 was never created → `proposal_proposer[99]` is the zero
# address sentinel.
[[tests]]
name = "vote_proposal_does_not_exist_reverts"

[tests.setup]
storage.members.alice = "1"
storage.member_count  = "1"

[[tests.calls]]
function = "vote"
from     = "alice"
args     = ["99", "1"]
expect.revert = "dao: proposal does not exist"

# ── Test 10: vote by a non-member reverts before the proposal check
[[tests]]
name = "vote_non_member_caller_reverts"

[[tests.calls]]
function = "vote"
from     = "bob"               # nobody seeded as a member
args     = ["1", "1"]
expect.revert = "dao: caller is not a member"

# ── Test 11: execute_proposal on a non-existent proposal reverts ───
#
# No member check on this entry — anyone can fire `execute_proposal`,
# the first guard is "proposal exists".
[[tests]]
name = "execute_proposal_does_not_exist_reverts"

[[tests.calls]]
function = "execute_proposal"
args     = ["99"]
expect.revert = "dao: proposal does not exist"

# ── Test 12: per-proposal view counters default to zero ────────────
[[tests]]
name = "unknown_proposal_counters_default_to_zero"

[[tests.calls]]
function = "get_proposal_yes"
args     = ["7"]
expect.return_value = "0"

[[tests.calls]]
function = "get_proposal_no"
args     = ["7"]
expect.return_value = "0"

[[tests.calls]]
function = "get_proposal_executed"
args     = ["7"]
expect.return_value = "0"

# ── Test 13: has_voted_on returns false for an unknown (id, voter)
[[tests]]
name = "has_voted_on_false_for_unknown_pair"

[[tests.calls]]
function = "has_voted_on"
args     = ["7", "alice"]
expect.return_value = "0"

# ── Test 14: voting_period_secs view returns the seeded scalar ─────
[[tests]]
name = "voting_period_secs_view_returns_seeded_scalar"

[tests.setup]
storage.voting_period_secs = "3600"

[[tests.calls]]
function = "voting_period_secs"
expect.return_value = "3600"

# ── Test 15: add_member rejects zero address before the dup check ──
#
# Originally proved the zero-address guard fired before the dup
# lookup. Now superseded by the self-call gate: every direct
# `add_member` call reverts at the access-control boundary,
# regardless of input shape. The downstream zero-address guard is
# exercised in the Python e2e harness via the proposal flow.
