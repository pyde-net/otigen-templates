# name              = "my-contract"                       # display name, lowercase [a-z0-9-] (may differ from contract.name)
# description       = "One-line summary of what this contract does."   # < 1000 chars
# website           = "https://example.com"               # https:// URL
# logo_url          = "https://example.com/logo.png"      # https:// URL
# repository_url    = "https://github.com/pyde-net/example"  # https:// URL
# documentation_url = "https://docs.example.com"          # https:// URL
# license           = "MIT"                               # SPDX id: MIT, Apache-2.0, GPL-3.0-only, BUSL-1.1, … (SPDX_IDENTIFIERS)
# authors           = ["Ada Lovelace <ada@example.com>"]  # "Name <email>" strings, ≤ 32 entries
# tags              = ["defi", "example"]                 # slugs [a-z0-9-], ≤ 32 entries
# declared_category = "app"                               # token|nft|dao|dex|lending|vault|oracle|bridge|multisig|staking|proxy|escrow|launchpad|registry|marketplace|payment|insurance|game|cred|rwa|app
