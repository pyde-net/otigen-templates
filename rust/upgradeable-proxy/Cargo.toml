[package]
name = "pyde_template"
version = "0.1.0"
edition = "2021"

[dependencies]
pyde-host = "0.1.0-alpha.14"
borsh = { version = "1.5", default-features = false, features = ["derive"] }

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level     = "z"
lto           = true
codegen-units = 1
strip         = true
panic         = "abort"

[package.metadata.cargo-machete]
# borsh is used via `#[derive(BorshSerialize, BorshDeserialize)]` —
# cargo-machete does not see derive proc-macro consumption.
ignored = ["borsh"]
