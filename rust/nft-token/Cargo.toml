[package]
name = "pyde_template"
version = "0.1.0"
authors = ["zarah <zarah@pyde.network>"]
edition = "2021"

[dependencies]
pyde-host = "0.1.0-alpha.9"
borsh = { version = "1.5", default-features = false, features = ["derive"] }

[lib]
# Compiled as a cdylib so wasm-ld emits an importable WASM module
# rather than a Rust rlib. `otigen build` post-processes the resulting
# `.wasm` (validates imports, injects the pyde.abi custom section).
crate-type = ["cdylib"]

# Release profile tuned for on-chain WASM:
#   opt-level = "z"      — smallest binary
#   lto = true           — cross-crate inlining
#   codegen-units = 1    — single codegen unit; deterministic output
#   strip = true         — drop symbol table + debug info
#   panic = "abort"      — no unwinding
[profile.release]
opt-level     = "z"
lto           = true
codegen-units = 1
strip         = true
panic         = "abort"

[package.metadata.cargo-machete]
# borsh is used via `#[derive(BorshSerialize, BorshDeserialize)]` —
# cargo-machete does not see derive proc-macro consumption.
ignored = ["borsh"]
