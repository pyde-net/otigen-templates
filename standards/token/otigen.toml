# pyde-template — the CONFIG-ONLY pts-f/1 fungible token.
#
# This is the zero-source counterpart to `examples/fungible-token`: the
# author writes only this manifest (`type = "token"`, `standard =
# "pts-f/1"`, and a `[token]` block) and `otigen build` GENERATES the
# full pts-f/1 contract, compiles it, and bundles it — no `src/` at all.
# The generated surface is drift-pinned to `examples/fungible-token`
# (the normative reference), so this and the hand-written reference
# produce the identical ABI.
#
# Default extension profile: no freeze, no pause, open registration,
# transfer_call on, burnable on — deployer is initial holder, minter,
# and manager.

[contract]
name     = "pyde-template"
version  = "0.1.0"
type     = "token"
standard = "pts-f/1"

[token]
name           = "Config Demo Token"
symbol         = "CFGD"
decimals       = 9                    # display decimals (default 9 = 1 PYDE parity)
initial_supply = "1000000000000000"   # smallest units, minted at deploy (1M CFGD @ 9dp)
# initial_holder = "deployer"         # who receives the supply: "deployer" (default) or a 0x… address

[token.supply]
# max_supply = "0"                    # hard cap in smallest units; 0 or omit = uncapped
# minter     = "deployer"             # who may mint: "deployer" (default) or a 0x… address
# manager    = "deployer"             # who may rotate roles: "deployer" (default) or a 0x… address

# ── Optional capabilities — spec'd (PIP-0005), codegen lands in a later
#    increment. Uncommenting these today fails the build with a clear
#    "not yet generated" message; they're shown so the full surface is
#    visible from the manifest. ──
# [token.supply]
# burnable = false                    # opt out of burn (default true)
#
# [token.hooks]
# transfer_call = false               # opt out of settle-then-notify deposits (default true)
#
# [token.extensions]
# freeze       = true                 # per-account freeze/unfreeze (adds the freezer role)
# pause        = true                 # global incident brake (adds the pauser role)
# registration = "required"           # "open" (default) | "required" (opt-in receiving + native-quanta bond)
# metadata_uri = "https://example.com/token.json"  # mutable, manager-custodied metadata URI

[network.default]
name = "devnet"

[network.devnet]
rpc_url  = "http://127.0.0.1:9933"
chain_id = 31337
